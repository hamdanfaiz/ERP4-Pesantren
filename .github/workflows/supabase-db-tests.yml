name: Supabase database tests

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: supabase-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start isolated local Supabase
        run: supabase start

      - name: Run database tests
        run: npm run test:db

      - name: Verify concurrent NIS reservation
        run: npm run test:db:nis-race

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
