services:
  erp4-pesantren:
    image: erp4-pesantren:${ERP4_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL to the Supabase API URL reachable from this container}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in the host environment or ignored .env file}
      VITE_SUPABASE_ACADEMIC_IMPORT_ENABLED: ${VITE_SUPABASE_ACADEMIC_IMPORT_ENABLED:-false}
      VITE_SUPABASE_BOARDING_ASSIGNMENTS_RUNTIME_ENABLED: ${VITE_SUPABASE_BOARDING_ASSIGNMENTS_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_BOARDING_ATTENDANCE_IMPORT_ENABLED: ${VITE_SUPABASE_BOARDING_ATTENDANCE_IMPORT_ENABLED:-false}
      VITE_SUPABASE_BOARDING_ATTENDANCE_RUNTIME_ENABLED: ${VITE_SUPABASE_BOARDING_ATTENDANCE_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_BOARDING_DISCIPLINE_IMPORT_ENABLED: ${VITE_SUPABASE_BOARDING_DISCIPLINE_IMPORT_ENABLED:-false}
      VITE_SUPABASE_BOARDING_DISCIPLINE_RUNTIME_ENABLED: ${VITE_SUPABASE_BOARDING_DISCIPLINE_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_BOARDING_FACILITY_OPS_IMPORT_ENABLED: ${VITE_SUPABASE_BOARDING_FACILITY_OPS_IMPORT_ENABLED:-false}
      VITE_SUPABASE_BOARDING_FACILITY_OPS_RUNTIME_ENABLED: ${VITE_SUPABASE_BOARDING_FACILITY_OPS_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_BOARDING_PERMITS_IMPORT_ENABLED: ${VITE_SUPABASE_BOARDING_PERMITS_IMPORT_ENABLED:-false}
      VITE_SUPABASE_BOARDING_PERMITS_RUNTIME_ENABLED: ${VITE_SUPABASE_BOARDING_PERMITS_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_BOARDING_RUNTIME_ENABLED: ${VITE_SUPABASE_BOARDING_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_COMMUNICATION_ANNOUNCEMENTS: ${VITE_SUPABASE_COMMUNICATION_ANNOUNCEMENTS:-false}
      VITE_SUPABASE_COMMUNICATION_IMPORT_ENABLED: ${VITE_SUPABASE_COMMUNICATION_IMPORT_ENABLED:-false}
      VITE_SUPABASE_FACILITY_BOOKINGS_IMPORT_ENABLED: ${VITE_SUPABASE_FACILITY_BOOKINGS_IMPORT_ENABLED:-false}
      VITE_SUPABASE_GA_ASSETS_IMPORT_ENABLED: ${VITE_SUPABASE_GA_ASSETS_IMPORT_ENABLED:-false}
      VITE_SUPABASE_HEALTHCARE_IMPORT_ENABLED: ${VITE_SUPABASE_HEALTHCARE_IMPORT_ENABLED:-false}
      VITE_SUPABASE_LMS_IMPORT_ENABLED: ${VITE_SUPABASE_LMS_IMPORT_ENABLED:-false}
      VITE_SUPABASE_MARKETPLACE_IMPORT_ENABLED: ${VITE_SUPABASE_MARKETPLACE_IMPORT_ENABLED:-false}
      VITE_SUPABASE_MASTER_DATA_IMPORT_ENABLED: ${VITE_SUPABASE_MASTER_DATA_IMPORT_ENABLED:-false}
      VITE_SUPABASE_MASTER_DATA_RUNTIME_ENABLED: ${VITE_SUPABASE_MASTER_DATA_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_PPDB_DOCUMENTS_RUNTIME_ENABLED: ${VITE_SUPABASE_PPDB_DOCUMENTS_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_PPDB_FINANCE_BILLS_ENABLED: ${VITE_SUPABASE_PPDB_FINANCE_BILLS_ENABLED:-false}
      VITE_SUPABASE_PPDB_ONBOARDING_RUNTIME_ENABLED: ${VITE_SUPABASE_PPDB_ONBOARDING_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_PPDB_RUNTIME_ENABLED: ${VITE_SUPABASE_PPDB_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY}
      VITE_SUPABASE_SYSTEM_SETTINGS: ${VITE_SUPABASE_SYSTEM_SETTINGS:-false}
      VITE_SUPABASE_SYSTEM_SETTINGS_IMPORT_ENABLED: ${VITE_SUPABASE_SYSTEM_SETTINGS_IMPORT_ENABLED:-false}
      VITE_SUPABASE_TAHFIDZ_IMPORT_ENABLED: ${VITE_SUPABASE_TAHFIDZ_IMPORT_ENABLED:-false}
      VITE_SUPABASE_TAHFIDZ_RUNTIME_ENABLED: ${VITE_SUPABASE_TAHFIDZ_RUNTIME_ENABLED:-false}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL to the browser-reachable Supabase API URL}
      APP_URL: ${APP_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      PII_FINGERPRINT_KEY: ${PII_FINGERPRINT_KEY:-}
      SUPABASE_ACADEMIC_IMPORT_ENABLED: ${SUPABASE_ACADEMIC_IMPORT_ENABLED:-false}
      SUPABASE_ACADEMIC_RUNTIME_ENABLED: ${SUPABASE_ACADEMIC_RUNTIME_ENABLED:-false}
      SUPABASE_ALUMNI_RUNTIME_ENABLED: ${SUPABASE_ALUMNI_RUNTIME_ENABLED:-false}
      SUPABASE_BOARDING_ASSIGNMENTS_RUNTIME_ENABLED: ${SUPABASE_BOARDING_ASSIGNMENTS_RUNTIME_ENABLED:-false}
      SUPABASE_BOARDING_ATTENDANCE_IMPORT_ENABLED: ${SUPABASE_BOARDING_ATTENDANCE_IMPORT_ENABLED:-false}
      SUPABASE_BOARDING_ATTENDANCE_RUNTIME_ENABLED: ${SUPABASE_BOARDING_ATTENDANCE_RUNTIME_ENABLED:-false}
      SUPABASE_BOARDING_DISCIPLINE_IMPORT_ENABLED: ${SUPABASE_BOARDING_DISCIPLINE_IMPORT_ENABLED:-false}
      SUPABASE_BOARDING_DISCIPLINE_RUNTIME_ENABLED: ${SUPABASE_BOARDING_DISCIPLINE_RUNTIME_ENABLED:-false}
      SUPABASE_BOARDING_FACILITY_OPS_IMPORT_ENABLED: ${SUPABASE_BOARDING_FACILITY_OPS_IMPORT_ENABLED:-false}
      SUPABASE_BOARDING_FACILITY_OPS_RUNTIME_ENABLED: ${SUPABASE_BOARDING_FACILITY_OPS_RUNTIME_ENABLED:-false}
      SUPABASE_BOARDING_PERMITS_IMPORT_ENABLED: ${SUPABASE_BOARDING_PERMITS_IMPORT_ENABLED:-false}
      SUPABASE_BOARDING_PERMITS_RUNTIME_ENABLED: ${SUPABASE_BOARDING_PERMITS_RUNTIME_ENABLED:-false}
      SUPABASE_BOARDING_RUNTIME_ENABLED: ${SUPABASE_BOARDING_RUNTIME_ENABLED:-false}
      SUPABASE_CBT_IMPORT_ENABLED: ${SUPABASE_CBT_IMPORT_ENABLED:-false}
      SUPABASE_CBT_RUNTIME_ENABLED: ${SUPABASE_CBT_RUNTIME_ENABLED:-false}
      SUPABASE_COMMUNICATION_IMPORT_ENABLED: ${SUPABASE_COMMUNICATION_IMPORT_ENABLED:-false}
      SUPABASE_COMMUNICATION_RUNTIME_ENABLED: ${SUPABASE_COMMUNICATION_RUNTIME_ENABLED:-false}
      SUPABASE_COOPERATIVE_FINANCIAL_IMPORT_APPLY_ENABLED: ${SUPABASE_COOPERATIVE_FINANCIAL_IMPORT_APPLY_ENABLED:-false}
      SUPABASE_COOPERATIVE_IMPORT_ENABLED: ${SUPABASE_COOPERATIVE_IMPORT_ENABLED:-false}
      SUPABASE_COOPERATIVE_RUNTIME_ENABLED: ${SUPABASE_COOPERATIVE_RUNTIME_ENABLED:-false}
      SUPABASE_CRM_RUNTIME_ENABLED: ${SUPABASE_CRM_RUNTIME_ENABLED:-false}
      SUPABASE_DASHBOARD_RUNTIME_ENABLED: ${SUPABASE_DASHBOARD_RUNTIME_ENABLED:-false}
      SUPABASE_DOCUMENT_RUNTIME_ENABLED: ${SUPABASE_DOCUMENT_RUNTIME_ENABLED:-false}
      SUPABASE_DONATION_RUNTIME_ENABLED: ${SUPABASE_DONATION_RUNTIME_ENABLED:-false}
      SUPABASE_FACILITY_BOOKINGS_IMPORT_ENABLED: ${SUPABASE_FACILITY_BOOKINGS_IMPORT_ENABLED:-false}
      SUPABASE_FACILITY_BOOKINGS_RUNTIME_ENABLED: ${SUPABASE_FACILITY_BOOKINGS_RUNTIME_ENABLED:-false}
      SUPABASE_FINANCE_PROOF_STORAGE_RUNTIME_ENABLED: ${SUPABASE_FINANCE_PROOF_STORAGE_RUNTIME_ENABLED:-false}
      SUPABASE_FINANCE_BUDGET_RUNTIME_ENABLED: ${SUPABASE_FINANCE_BUDGET_RUNTIME_ENABLED:-false}
      SUPABASE_FINANCE_RUNTIME_ENABLED: ${SUPABASE_FINANCE_RUNTIME_ENABLED:-false}
      SUPABASE_ENTERPRISE_UNITS_RUNTIME_ENABLED: ${SUPABASE_ENTERPRISE_UNITS_RUNTIME_ENABLED:-false}
      SUPABASE_GA_ASSETS_IMPORT_ENABLED: ${SUPABASE_GA_ASSETS_IMPORT_ENABLED:-false}
      SUPABASE_GA_ASSETS_RUNTIME_ENABLED: ${SUPABASE_GA_ASSETS_RUNTIME_ENABLED:-false}
      SUPABASE_HEALTHCARE_IMPORT_ENABLED: ${SUPABASE_HEALTHCARE_IMPORT_ENABLED:-false}
      SUPABASE_HEALTHCARE_RUNTIME_ENABLED: ${SUPABASE_HEALTHCARE_RUNTIME_ENABLED:-false}
      SUPABASE_HRIS_IMPORT_ENABLED: ${SUPABASE_HRIS_IMPORT_ENABLED:-false}
      SUPABASE_HRIS_RUNTIME_ENABLED: ${SUPABASE_HRIS_RUNTIME_ENABLED:-false}
      SUPABASE_LAUNDRY_RUNTIME_ENABLED: ${SUPABASE_LAUNDRY_RUNTIME_ENABLED:-false}
      SUPABASE_LEGACY_FINGERPRINT_KEY: ${SUPABASE_LEGACY_FINGERPRINT_KEY:-}
      SUPABASE_LIBRARY_CIRCULATIONS_IMPORT_ENABLED: ${SUPABASE_LIBRARY_CIRCULATIONS_IMPORT_ENABLED:-false}
      SUPABASE_LIBRARY_DIGITAL_ASSETS_ENABLED: ${SUPABASE_LIBRARY_DIGITAL_ASSETS_ENABLED:-false}
      SUPABASE_LIBRARY_IMPORT_ENABLED: ${SUPABASE_LIBRARY_IMPORT_ENABLED:-false}
      SUPABASE_LIBRARY_RUNTIME_ENABLED: ${SUPABASE_LIBRARY_RUNTIME_ENABLED:-false}
      SUPABASE_LMS_IMPORT_ENABLED: ${SUPABASE_LMS_IMPORT_ENABLED:-false}
      SUPABASE_LMS_RUNTIME_ENABLED: ${SUPABASE_LMS_RUNTIME_ENABLED:-false}
      SUPABASE_MARKETPLACE_IMPORT_ENABLED: ${SUPABASE_MARKETPLACE_IMPORT_ENABLED:-false}
      SUPABASE_MARKETPLACE_RUNTIME_ENABLED: ${SUPABASE_MARKETPLACE_RUNTIME_ENABLED:-false}
      SUPABASE_MASTER_DATA_IMPORT_ENABLED: ${SUPABASE_MASTER_DATA_IMPORT_ENABLED:-false}
      SUPABASE_MASTER_DATA_RUNTIME_ENABLED: ${SUPABASE_MASTER_DATA_RUNTIME_ENABLED:-false}
      SUPABASE_PPDB_DOCUMENTS_RUNTIME_ENABLED: ${SUPABASE_PPDB_DOCUMENTS_RUNTIME_ENABLED:-false}
      SUPABASE_PPDB_FINANCE_BILLS_ENABLED: ${SUPABASE_PPDB_FINANCE_BILLS_ENABLED:-false}
      SUPABASE_PPDB_IMPORT_ENABLED: ${SUPABASE_PPDB_IMPORT_ENABLED:-false}
      SUPABASE_PPDB_ONBOARDING_RUNTIME_ENABLED: ${SUPABASE_PPDB_ONBOARDING_RUNTIME_ENABLED:-false}
      SUPABASE_PPDB_RUNTIME_ENABLED: ${SUPABASE_PPDB_RUNTIME_ENABLED:-false}
      SUPABASE_PUBLIC_PPDB_RUNTIME_ENABLED: ${SUPABASE_PUBLIC_PPDB_RUNTIME_ENABLED:-false}
      SUPABASE_SEARCH_FEEDBACK_RUNTIME_ENABLED: ${SUPABASE_SEARCH_FEEDBACK_RUNTIME_ENABLED:-false}
      SUPABASE_SYSTEM_SETTINGS_IMPORT_ENABLED: ${SUPABASE_SYSTEM_SETTINGS_IMPORT_ENABLED:-false}
      SUPABASE_SYSTEM_SETTINGS_RUNTIME_ENABLED: ${SUPABASE_SYSTEM_SETTINGS_RUNTIME_ENABLED:-false}
      SUPABASE_TAHFIDZ_IMPORT_ENABLED: ${SUPABASE_TAHFIDZ_IMPORT_ENABLED:-false}
      SUPABASE_TAHFIDZ_RUNTIME_ENABLED: ${SUPABASE_TAHFIDZ_RUNTIME_ENABLED:-false}
      LEGACY_FIREBASE_ADMIN_ENABLED: "false"
      LEGACY_FIREBASE_SETTINGS_CLEANUP_ENABLED: "false"
    ports:
      - "${ERP4_HTTP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

